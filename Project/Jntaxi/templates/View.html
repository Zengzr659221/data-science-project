<!DOCTYPE HTML>
<html>
<head>
  <title>Load Massive Points</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <style type="text/css">
    html,body{ margin:0; width:100%; height:100%; background:#ffffff; }
    #map{ width:100%; height:100%; }
  </style>
  <!-- 记得确认你的 AK 有没有配置 Referer 白名单 -->
  <script type="text/javascript" src="//api.map.baidu.com/api?v=2.0&ak=qJT8bubOV3nXyJVIirI5zEnaBO3guonk"></script>
</head>
<body>
    <div id="map"></div>
    <script type="text/javascript">
    // 创建Map实例
    var map = new BMap.Map("map", {});
    map.centerAndZoom(new BMap.Point(117.078115728003, 36.6721433229127), 11);
    map.enableScrollWheelZoom();

    // 判断当前浏览器是否支持绘制海量点
    if (document.createElement('canvas').getContext) {

        // 1. 接收后端传来的标准 JSON 数据
        var rawPoints = {{ aa|safe }};

        // 2. 转换为 BMap.Point 对象数组
        var points = [];
        for (var i = 0; i < rawPoints.length; i++) {
            // 注意经纬度顺序：经度(lng) 在前，纬度(lat) 在后
            var pt = new BMap.Point(rawPoints[i].lng, rawPoints[i].lat);
            pt.name = rawPoints[i].name; // 挂载车牌号用于点击显示
            points.push(pt);
        }

        var options = {
            shape: BMAP_POINT_SHAPE_WATERDROP,
            color: '#d340c3'
        };

        // 3. 初始化海量点
        var pointCollection = new BMap.PointCollection(points, options);

        pointCollection.addEventListener('click', function (e) {
          alert('单击点的坐标为：' + e.point.lng + ',' + e.point.lat + '   车牌号为：' + e.point.name);
        });

        map.addOverlay(pointCollection);
    } else {
        alert('请在chrome、safari、IE8+以上浏览器查看本示例');
    }
  </script>
</body>
</html>
